<!DOCTYPE html>
<html lang="en">
<head>
<title>Lamoni Rose Hill Map</title>
<meta charset="utf-8">
<style>
* {
	box-sizing: border-box;
}
body {
	font-family:sans-serif;
}
.center {
	text-align: center;
}
.mapbox {
	position:relative;
	margin:auto;
	min-width:450px;
	max-width:800px;
}
.mapbox>img{
	width:100%;
	height:auto;
}
.used {
	position:absolute;
	color:yellow;
	border: yellow .0vw solid;
	font:bold 150% Arial, sans-serif;
	text-align: center;
	padding-top: .5vw;
	cursor: pointer;
	-webkit-user-select: none;
	user-select: none;
}
.unused {
	position:absolute;
	color:yellow;
	border: none;
	font:italic 100% Arial, sans-serif;
	text-align: center;
	padding-top: .5vw;
	cursor: pointer;
	-webkit-user-select: none;
	user-select: none;
}
</style>
</head>
<body>
