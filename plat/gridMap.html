<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cemetery Plat Map with Always-Visible Numbers</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
  }

  .map-container {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #f0f0f0;
    position: relative;
    cursor: grab;
  }

  /* Grid now has extra row/col for headers */
  .map-grid {
    display: grid;
    grid-template-columns: repeat(19, 84px); /* 1 for row header + 18 plots */
    grid-template-rows: repeat(11, 72px);    /* 1 for col header + 10 plots */
    transform-origin: 0 0;
    user-select: none;
  }

  /* Empty corner cell */
  .corner {
    background: #f0f0f0;
  }

  /* Row & column headers */
  .header {
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    border: none;
  }

  /* Plot cells */
  .plot {
    border: 1px solid #bbb;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px; /* always show plot number */
    text-align: center;
    line-height: 1.2;
    transition: font-size 0.2s;
  }

  .plot:hover {
    background: #d9f0ff;
  }
</style>
</head>
<body>

<h1> Section 1n </h1>

<div class="map-container" id="mapContainer">
  <div class="map-grid" id="mapGrid"></div>
</div>

<script>
const cols = 18; // plots wide
const rows = 10; // plots tall
const grid = document.getElementById('mapGrid');

// Build grid with headers + column-major numbering
for (let r = 0; r <= rows; r++) {
  for (let c = 0; c <= cols; c++) {

    // Top-left corner
    if (r === 0 && c === 0) {
      const div = document.createElement('div');
      div.className = 'corner';
      grid.appendChild(div);
    }
    // Column headers
    else if (r === 0) {
      const div = document.createElement('div');
      div.className = 'header';
      div.textContent = c;
      grid.appendChild(div);
    }
    // Row headers
    else if (c === 0) {
      const div = document.createElement('div');
      div.className = 'header';
      div.textContent = r;
      grid.appendChild(div);
    }
    // Plot cells
    else {
      const plotNumber =  976 + (c - 1) * rows + r; // column-major
      const div = document.createElement('div');
      div.className = 'plot';
      div.dataset.number = plotNumber;
      div.dataset.names = "John Doe\nMary Smith"; // fake names
      grid.appendChild(div);
    }
  }
}

let zoom = 0.8;
let offsetX = 0;
let offsetY = 0;
let isPanning = false;
let startX, startY;

function updateTransform() {
  grid.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${zoom})`;
}

function updateLabels() {
  document.querySelectorAll('.plot').forEach(plot => {
    const num = plot.dataset.number;
    const names = plot.dataset.names.split("\n");
    if (zoom >= 2) {
      plot.innerHTML = `${num}<br>${names[0]}<br>${names[1]}`;
    } else {
      plot.innerHTML = `${num}`;
    }
  });
}

// Zoom
mapContainer.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomFactor = 0.1;
  zoom += (e.deltaY < 0 ? zoomFactor : -zoomFactor);
  zoom = Math.min(Math.max(zoom, 0.5), 4);
  updateTransform();
  updateLabels();
});

// Pan
mapContainer.addEventListener('mousedown', e => {
  isPanning = true;
  startX = e.clientX - offsetX;
  startY = e.clientY - offsetY;
  mapContainer.style.cursor = 'grabbing';
});
mapContainer.addEventListener('mouseup', () => {
  isPanning = false;
  mapContainer.style.cursor = 'grab';
});
mapContainer.addEventListener('mousemove', e => {
  if (!isPanning) return;
  offsetX = e.clientX - startX;
  offsetY = e.clientY - startY;
  updateTransform();
});

updateTransform();
updateLabels();
</script>

</body>
</html>
